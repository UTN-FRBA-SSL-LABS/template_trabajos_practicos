name: Static Analysis

on:
  pull_request:
    branches:
      - main

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Cppcheck and Cpplint
      run: |
        .github/scripts/apt-install.sh cppcheck python3-pip
        timeout --signal=TERM --kill-after=10s 3m pip3 install --retries 3 --timeout 30 cpplint

    - name: Run Cppcheck
      continue-on-error: true
      run: cppcheck --enable=all .

    - name: Run Cpplint
      continue-on-error: true
      run: find . -name '*.c' -o -name '*.h' | xargs cpplint --filter=-legal/copyright
